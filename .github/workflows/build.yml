name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Source Code
        run: |
          # 解压压缩包，并把里面的一层 WAYTA 文件夹内容挪到根目录
          unzip WAYTA.zip
          if [ -d "WAYTA" ]; then mv WAYTA/* . ; rm -rf WAYTA; fi
          # 确认关键文件在根目录
          ls -la
          echo "检查必要文件:"
          ls qidong.py buildozer.spec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAYTA-APK
          path: bin/*.apk
