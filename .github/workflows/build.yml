name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持在 Actions 页面手动点击按钮触发构建

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Source Code
        run: |
          echo "开始解压压缩包..."
          unzip WAYTA.zip
          if [ -d "WAYTA" ]; then mv WAYTA/* . ; rm -rf WAYTA; fi
          echo "解压完成，当前目录文件列表："
          ls -la
          
          # ★ 核心修复：自动接受 Android SDK 许可协议，避免构建中途退出
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "已注入许可配置，检查 buildozer.spec 末尾："
          tail -n 5 buildozer.spec
          
          echo "检查必要文件是否存在："
          ls qidong.py buildozer.spec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAYTA-APK
          path: bin/*.apk
